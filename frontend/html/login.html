<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso à Conta - Rokuzen</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login_cadastro.css"> 
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
</head>
<body>

    <header class="container-fluid py-3 px-4 d-flex justify-content-between align-items-center">
        <img src="../img/logo.png" alt="Logo Rokuzen" class="logo">
        <nav class="d-none d-lg-flex gap-4">
            <a href="#" class="nav-link">Home</a>
            <a href="#" class="nav-link">Quem nós somos</a>
            <a href="#" class="nav-link">Serviços</a>
        </nav>
    </header>

    <div class="container-fluid g-0">
        <div class="row g-0" style="height: calc(100vh - 73px);"> 
            <div class="col-lg-7 d-none d-lg-block coluna-imagem"></div>

            <div class="col-lg-5 d-flex flex-column justify-content-center align-items-center">
                
                <main class="w-100 d-flex justify-content-center align-items-center flex-grow-1 p-4">
                    
                    <div class="form-container">

                        <div id="form-login">
                            <div class="text-center mb-4">
                                <h1 class="h3 fw-bold">Entre na sua conta</h1>
                                <p class="text-secondary small">Digite seu E-Mail para continuar</p>
                            </div>
                            <form id="loginForm">
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="loginEmail" placeholder="E-Mail" required>
                                </div>
                                <div class="input-group mb-4">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="loginSenha" placeholder="Digite sua senha" required>
                                    <span class="input-group-text toggle-password"><i class="bi bi-eye"></i></span>
                                </div>
                                <button class="w-100 btn btn-rokuzen" type="submit">Login</button>
                                <div class="text-center mt-3">
                                    <a href="esqueci-senha.html" class="link-secondary small">Esqueci minha senha</a>
                                    <p class="mt-2 small text-secondary">Não tem uma conta? <a href="#" id="link-mostrar-cadastro" class="link-rokuzen">Cadastre-se</a></p>
                                </div>
                            </form>
                        </div>

                        <div id="form-cadastro" class="d-none">
                            <div class="text-center mb-4">
                                <h1 class="h3 fw-bold">Crie sua Conta</h1>
                                <p class="text-secondary small">Preencha os dados para começar</p>
                            </div>
                            <form id="cadastroForm">
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-person"></i></span>
                                    <input type="text" class="form-control" id="cadastroNome" placeholder="Nome Completo" required>
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-envelope"></i></span>
                                    <input type="email" class="form-control" id="cadastroEmail" placeholder="E-Mail" required>
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-file-person"></i></span>
                                    <input type="text" class="form-control" id="cadastroCPF" placeholder="CPF" required>
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-telephone"></i></span>
                                    <input type="tel" class="form-control" id="cadastroTelefone" placeholder="Telefone" required>
                                </div>
                                <div class="input-group mb-3">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="cadastroSenha" placeholder="Crie uma senha" required>
                                    <span class="input-group-text toggle-password"><i class="bi bi-eye"></i></span>
                                </div>
                                <div class="input-group mb-4">
                                    <span class="input-group-text"><i class="bi bi-lock"></i></span>
                                    <input type="password" class="form-control" id="cadastroConfirmaSenha" placeholder="Confirme sua senha" required>
                                    <span class="input-group-text toggle-password"><i class="bi bi-eye"></i></span>
                                </div>
                                <div class="form-check mb-4">
                                    <input class="form-check-input" type="checkbox" value="" id="termos" required>
                                    <label class="form-check-label small text-secondary" for="termos">
                                        Aceito os <a href="#" class="link-rokuzen">Termos de Uso</a> e <a href="#" class="link-rokuzen">Política de Privacidade</a>
                                    </label>
                                </div>
                                <button class="w-100 btn btn-rokuzen" type="submit">Criar Conta</button>
                                <div class="text-center mt-3">
                                    <p class="mt-2 small text-secondary">Já tem uma conta? <a href="#" id="link-mostrar-login" class="link-rokuzen">Faça Login</a></p>
                                </div>
                            </form>
                        </div>
                         <div id="alerta" class="alert mt-4 d-none" role="alert"></div>
                    </div>
                </main>

            </div>
        </div>
    </div>

    <script src="../script/login.js"></script>
</body>
</html>
