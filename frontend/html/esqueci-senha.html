<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Recuperar Senha - Rokuzen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login_cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <img src="../img/logo.png" alt="Logo Rokuzen" class="logo mb-4">
                <h1 class="h3 fw-bold">Recuperar sua senha</h1>
                <p class="text-secondary small">Digite seu e-mail para enviarmos um link de recuperação.</p>
            </div>
            <form id="esqueciSenhaForm">
                <div class="input-group mb-3">
                    <input type="email" class="form-control" id="emailRecuperacao" placeholder="Seu e-mail" required>
                </div>
                <button class="w-100 btn btn-rokuzen" type="submit">Enviar link</button>
            </form>
            <div id="alerta" class="alert mt-3 d-none" role="alert"></div>
            <p class="mt-3 text-center small"><a href="login.html" class="link-rokuzen">Voltar para o Login</a></p>
        </div>
    </div>
    <script src="../script/esqueci-senha.js"></script>
</body>
</html>
