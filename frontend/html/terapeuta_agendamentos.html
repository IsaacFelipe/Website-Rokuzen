<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Agendamentos - Rokuzen</title>
    
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    
    <link rel="stylesheet" href="../css/agendamento_t.css">
</head>

<body>

    <header class="cabecalho">
        <div class="perfil-terapeuta">
            <img src="../img/primeiro profissional 1.png" alt="Avatar de Midori Arawaka">
            <span id="nome-terapeuta">Carregando...</span>
        </div>
        <nav class="barra-navegacao">
            <ul>
                <li><a href="../html/Terapeuta.html">Início</a></li>
                <li><a href="../html/terapeuta_escala.html">Escalas</a></li>
                <li><a href="../html/terapeuta_agendamentos.html" class="ativo">Agendamentos</a></li>
            </ul>
        </nav>
    </header>

    <main class="conteudo-principal">
        <section class="modulo">
            <h2 class="titulo-modulo">Consultar Agendamentos</h2>
            
            <div class="d-flex flex-wrap gap-3 mb-4">
                
                <div class="input-group flex-grow-1" style="min-width: 300px;">
                    <span class="input-group-text"><i class="bi bi-search"></i></span>
                    <input type="search" class="form-control" id="filtro-pesquisa" placeholder="Pesquisar por paciente, serviço...">
                </div>

                <div class="btn-group" role="group">
                    <button class="btn btn-outline-secondary btn-filtro ativo" data-filtro="dia">Dia</button>
                    <button class="btn btn-outline-secondary btn-filtro" data-filtro="mes">Mês</button>
                    <button class="btn btn-outline-secondary btn-filtro" data-filtro="ano">Ano</button>
                </div>
            </div>

            <div class="cartao">
                <ul id="lista-agendamentos" class="lista-sessao">
                    </ul>
                <p id="mensagem-lista" class="text-center text-secondary d-none" style="padding: 20px;">
                    Carregando...
                </p>
            </div>
        </section>
    </main>
    
    <script src="https://unpkg.com/jwt-decode@3.1.2/build/jwt-decode.js"></script>
    
    <script src="../script/terapeuta_agendamentos.js"></script>

</body>

</html>
