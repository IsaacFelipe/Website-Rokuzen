<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Redefinir Senha - Rokuzen</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/login_cadastro.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container my-5" style="max-width: 500px;">
        <div class="card shadow-sm p-4">
            <div class="text-center mb-4">
                <img src="../img/logo.png" alt="Logo Rokuzen" class="logo mb-4">
                <h1 class="h3 fw-bold">Crie uma nova senha</h1>
            </div>
            <form id="redefinirSenhaForm">
                <div class="input-group mb-3">
                    <input type="password" class="form-control" id="novaSenha" placeholder="Digite sua nova senha" required>
                </div>
                <div class="input-group mb-3">
                    <input type="password" class="form-control" id="confirmaNovaSenha" placeholder="Confirme a nova senha" required>
                </div>
                <button class="w-100 btn btn-rokuzen" type="submit">Redefinir Senha</button>
            </form>
            <div id="alerta" class="alert mt-3 d-none" role="alert"></div>
        </div>
    </div>
    <script src="../script/redefinir-senha.js"></script>
</body>
</html>
