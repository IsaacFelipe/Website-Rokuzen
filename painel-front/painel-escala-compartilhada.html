<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ROKUZEN - Escala Compartilhada</title>
    <link rel="stylesheet" href="painel-styles.css">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body data-page="escala-compartilhada">
    <div class="dashboard-container">
        <div id="dashboard-loader" class="dashboard-loader">
            <div class="loader-spinner"></div>
            <span>Carregando painel...</span>
        </div>

        <header class="header">
            <div class="header-left">
                <div class="logo">
                    <img src="assets/img/logo-rokuzen-pequena.png" alt="ROKUZEN" class="logo-image">
                </div>
            </div>
            <div class="header-right">
                <div class="user-profile">
                    <i class="fas fa-user-circle"></i>
                </div>
            </div>
        </header>

        <nav class="sidebar">
            <ul class="nav-menu">
                <li class="nav-item">
                    <a href="painel-painel.html" data-section="painel">
                        <i class="fas fa-tachometer-alt"></i>
                        <span>Painel</span>
                        <i class="fas fa-chevron-right arrow"></i>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-atendimento.html" data-section="atendimento">
                        <i class="fas fa-calendar-check"></i>
                        <span>Atendimento</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-clientes.html" data-section="clientes">
                        <i class="fas fa-users"></i>
                        <span>Clientes</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-colaboradores.html" data-section="colaboradores">
                        <i class="fas fa-user-tie"></i>
                        <span>Colaboradores</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-entradas-saidas.html" data-section="entradas-saidas">
                        <i class="fas fa-exchange-alt"></i>
                        <span>Entradas/Saídas</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-gift-card.html" data-section="gift-card">
                        <i class="fas fa-gift"></i>
                        <span>Gift Card</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-biblioteca.html" data-section="biblioteca">
                        <i class="fas fa-book"></i>
                        <span>Biblioteca</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-parceiros.html" data-section="parceiros">
                        <i class="fas fa-handshake"></i>
                        <span>Parceiros</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-escala-compartilhada.html" data-section="escala-compartilhada">
                        <i class="fas fa-clock"></i>
                        <span>Escala Compartilhada</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-procedimentos.html" data-section="procedimentos">
                        <i class="fas fa-list-alt"></i>
                        <span>Procedimentos</span>
                    </a>
                </li>
                <li class="nav-item">
                    <a href="painel-auditoria.html" data-section="auditoria">
                        <i class="fas fa-shield-alt"></i>
                        <span>Auditoria</span>
                    </a>
                </li>
            </ul>
        </nav>

        <main class="main-content">
            <section id="escala-compartilhada" class="content-section active">
                <div class="section-header">
                    <h2>Escala Compartilhada</h2>
                    <p>Gestão de escalas e horários da equipe</p>
                </div>
                <div class="card full-width">
                    <div class="card-header">
                        <i class="fas fa-calendar-alt"></i>
                        <h3>Calendário Compartilhado</h3>
                    </div>
                    <div class="card-content">
                        <div class="attendance-controls" id="shared-calendar-controls">
                            <div class="date-filter">
                                <label for="calendar-url-input">URL do Google Calendar (embed):</label>
                                <input type="text" id="calendar-url-input" class="date-input" placeholder="Cole aqui a URL de incorporação do Google Calendar">
                            </div>
                            <div class="filter-buttons">
                                <button class="btn btn-secondary" id="calendar-url-reset">
                                    <i class="fas fa-undo"></i>
                                    Limpar
                                </button>
                                <button class="btn btn-primary" id="calendar-url-save">
                                    <i class="fas fa-save"></i>
                                    Salvar URL
                                </button>
                            </div>
                        </div>

                        <div id="shared-calendar-container" class="shared-calendar-container">
                        </div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="script/api-client.js"></script>
    <script src="script/painel-script.js"></script>
</body>
</html>
